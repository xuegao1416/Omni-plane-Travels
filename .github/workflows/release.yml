name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      native: ${{ steps.metadata.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: validate release version and changelog
        id: metadata
        run: bun scripts/release-metadata.ts

  build-web:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test
      - name: build Web
        run: bun run build
      - name: prepare release notes
        run: bun scripts/release-metadata.ts
      - name: package Web build
        working-directory: dist
        run: zip -r ../omni-plane-travels-v${{ needs.prepare-release.outputs.version }}-web.zip .
      - name: upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: omni-plane-travels-v${{ needs.prepare-release.outputs.version }}-web
          path: omni-plane-travels-v${{ needs.prepare-release.outputs.version }}-web.zip
          if-no-files-found: error
      - name: create or update draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          artifact="omni-plane-travels-${tag}-web.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --clobber
          else
            gh release create "$tag" "$artifact" --verify-tag --draft --title "世界漫游指南 ${tag}" --notes-file .release-notes.md
          fi

  publish-tauri:
    needs: [prepare-release, build-web]
    if: needs.prepare-release.outputs.native == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: '世界漫游指南 v__VERSION__'
          releaseBody: |
            ## 更新内容
            - 详见 docs/CHANGELOG.md

            ## 下载说明
            - Windows 用户下载 `.exe` 或 `.msi` 安装包
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: [prepare-release, build-web]
    if: needs.prepare-release.outputs.native == 'true'
    name: build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: install Android packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: initialize Android project
        run: bun run tauri:android:init

      - name: build installable Android APK
        run: bun run tauri:android:build:debug

      - name: upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-plane-travels-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
