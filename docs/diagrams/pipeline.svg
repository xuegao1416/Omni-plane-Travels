<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="varGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="settleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>

    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M20 21a8 8 0 1 0-16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-brain" viewBox="0 0 24 24">
      <path d="M12 2a4 4 0 0 1 4 4 3 3 0 0 1 2 5.24V16a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-4.76A3 3 0 0 1 8 6a4 4 0 0 1 4-4z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v20M8 6h8M8 16h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-pen" viewBox="0 0 24 24">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-file-text" viewBox="0 0 24 24">
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4M10 13H8M16 17H8M16 13h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m21 21-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-arrow-up-down" viewBox="0 0 24 24">
      <path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-code" viewBox="0 0 24 24">
      <path d="m16 18 6-6-6-6M8 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M17 21v-8H7v8M7 3v5h8" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 3v4M19 17v4M3 5h4M17 19h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="800" height="1130" fill="#0f172a" rx="12"/>

  <!-- 标题 -->
  <text x="400" y="42" text-anchor="middle" fill="white" font-size="23" font-weight="bold">单轮 AI 管线</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">PipelineTaskId 共 12 个任务：执行序 9 层 11 个任务（第 2 层三路并行）+ 循环外单独执行的 settlement</text>

  <!-- 用户输入 -->
  <rect x="270" y="78" width="260" height="44" rx="22" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <use href="#icon-user" x="304" y="90" width="18" height="18" color="#a5b4fc"/>
  <text x="400" y="105" text-anchor="middle" fill="#a5b4fc" font-size="13">用户输入</text>

  <line x1="400" y1="122" x2="400" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 正文前：本地机械结算 -->
  <rect x="90" y="154" width="620" height="46" rx="6" fill="#0b2534" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <use href="#icon-clock" x="106" y="168" width="14" height="14" color="#7dd3fc"/>
  <text x="128" y="176" fill="#7dd3fc" font-size="11.5" font-weight="600">正文之前 · 本地机械结算（不依赖 AI，关闭导演也不停）</text>
  <text x="128" y="192" fill="#94a3b8" font-size="10.5">prepareWorldMechanics → commitWorldMechanics → syncFromEngine → VARIABLE_UPDATE_ENDED</text>

  <line x1="400" y1="200" x2="400" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: main -->
  <rect x="140" y="230" width="520" height="86" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="230" width="520" height="34" rx="8" fill="url(#headerGrad)"/>
  <text x="170" y="253" fill="white" font-size="13" font-weight="bold">Stage 1 · main</text>
  <text x="655" y="253" fill="white" font-size="12" text-anchor="end">正文生成</text>
  <use href="#icon-sparkles" x="588" y="241" width="14" height="14" color="white"/>
  <text x="170" y="282" fill="#94a3b8" font-size="12">组装系统提示词 → 请求 AI → 解析响应（配置层强制 stream:false）</text>
  <text x="170" y="302" fill="#64748b" font-size="11">提取 content · OPTION · thinking · summary · 空响应重试 1 次</text>

  <line x1="400" y1="316" x2="400" y2="344" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 记忆管线标题 -->
  <rect x="230" y="348" width="340" height="32" rx="16" fill="url(#memoryGrad)"/>
  <use href="#icon-brain" x="262" y="356" width="16" height="16" color="white"/>
  <text x="388" y="369" text-anchor="middle" fill="white" font-size="12.5" font-weight="bold">记忆管线 · 8 个任务（第 2 层三路并行）</text>

  <line x1="400" y1="380" x2="400" y2="406" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 并行层：write / summary / vector -->
  <g transform="translate(140, 410)">
    <rect width="166" height="76" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.92"/>
    <rect width="166" height="22" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="10" y="15" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 2 · memory_write</text>
    <use href="#icon-pen" x="10" y="30" width="12" height="12" color="#fde68a"/>
    <text x="27" y="40" fill="#fde68a" font-size="11" font-weight="600">记忆写入</text>
    <text x="10" y="56" fill="#94a3b8" font-size="9.5">场景/线索/关系/事件</text>
    <text x="10" y="69" fill="#94a3b8" font-size="9.5">合并到运行时</text>
  </g>
  <g transform="translate(317, 410)">
    <rect width="166" height="76" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.92"/>
    <rect width="166" height="22" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="10" y="15" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 2 · memory_summary</text>
    <use href="#icon-file-text" x="10" y="30" width="12" height="12" color="#fde68a"/>
    <text x="27" y="40" fill="#fde68a" font-size="11" font-weight="600">摘要保存</text>
    <text x="10" y="56" fill="#94a3b8" font-size="9.5">玩家/角色/物品</text>
    <text x="10" y="69" fill="#94a3b8" font-size="9.5">结构化摘要</text>
  </g>
  <g transform="translate(494, 410)">
    <rect width="166" height="76" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.92"/>
    <rect width="166" height="22" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="10" y="15" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 2 · memory_vector</text>
    <use href="#icon-database" x="10" y="30" width="12" height="12" color="#fde68a"/>
    <text x="27" y="40" fill="#fde68a" font-size="11" font-weight="600">向量提取</text>
    <text x="10" y="56" fill="#94a3b8" font-size="9.5">长期事实 → 向量条目</text>
    <text x="10" y="69" fill="#94a3b8" font-size="9.5">失败不阻塞主线</text>
  </g>
  <text x="400" y="502" text-anchor="middle" fill="#64748b" font-size="10">同层并行 · 层间串行</text>

  <line x1="400" y1="510" x2="400" y2="532" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3-8 -->
  <g transform="translate(140, 536)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 3</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">query_rewrite</text>
    <use href="#icon-search" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">查询改写</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">分析用户输入 → 检索关键词 + 语义查询</text>
  </g>
  <g transform="translate(140, 594)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 4</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">retrieve_plan</text>
    <use href="#icon-list" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">检索规划</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">AI 从全部记忆中挑出本轮候选</text>
  </g>
  <g transform="translate(140, 652)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 5</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">multi_round</text>
    <use href="#icon-layers" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">多轮补充</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">默认关闭；开启后默认上限 3 轮</text>
  </g>
  <g transform="translate(140, 710)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 6</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">rerank</text>
    <use href="#icon-arrow-up-down" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">精排</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">AI 相关性打分重排序</text>
  </g>
  <g transform="translate(140, 768)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 7</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">retrieve_finalize</text>
    <use href="#icon-check-circle" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">检索定稿</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">纯本地：标题匹配 → 关键词命中 → 去重 → 按来源序升序</text>
  </g>
  <g transform="translate(140, 826)">
    <rect width="520" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <rect width="118" height="52" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="59" y="22" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="bold">Stage 8</text>
    <text x="59" y="39" text-anchor="middle" fill="#fbbf24" font-size="9.5">compile</text>
    <use href="#icon-code" x="130" y="18" width="12" height="12" color="#fde68a"/>
    <text x="148" y="28" fill="#fde68a" font-size="11.5" font-weight="600">上下文编译</text>
    <text x="130" y="43" fill="#94a3b8" font-size="10">运行时 → 注入文本，写入系统提示词第 4 段</text>
  </g>

  <line x1="400" y1="884" x2="400" y2="906" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 9: variable -->
  <rect x="140" y="910" width="520" height="66" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="910" width="520" height="30" rx="8" fill="url(#varGrad)"/>
  <text x="170" y="930" fill="white" font-size="12.5" font-weight="bold">Stage 9 · variable</text>
  <text x="655" y="930" fill="white" font-size="11.5" text-anchor="end">变量提取</text>
  <use href="#icon-settings" x="588" y="918" width="14" height="14" color="white"/>
  <text x="170" y="956" fill="#94a3b8" font-size="11.5">独立 API 调用 → 解析 UpdateVariable → 应用补丁 → 校验 → 快照</text>

  <line x1="400" y1="980" x2="400" y2="1002" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- settlement：循环外 -->
  <rect x="90" y="1006" width="620" height="74" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="1006" width="620" height="30" rx="8" fill="url(#settleGrad)"/>
  <text x="112" y="1026" fill="white" font-size="12.5" font-weight="bold">循环外 · settlement（玩法结算）</text>
  <text x="688" y="1026" fill="white" font-size="11.5" text-anchor="end">不在 DEFAULT_EXECUTION_ORDER 内</text>
  <text x="112" y="1050" fill="#94a3b8" font-size="10.5">settleNarrativeResponse → preserveCombatOwnedState → 世界时钟推进 → 成长结算 → 回合周期结算</text>
  <text x="112" y="1066" fill="#64748b" font-size="9.5">变量未接纳时抛错、要求先补交变量提取；模块执行未提交同样抛错</text>

  <use href="#icon-save" x="300" y="1094" width="12" height="12" color="#64748b"/>
  <text x="400" y="1105" text-anchor="middle" fill="#64748b" font-size="10.5">结算通过后写快照 + 自动存档</text>
</svg>
